                            desc: isEs ? 'Producción de sonido y géneros modernos.' : isEn ? 'Sound design, digital editing, and genres.' : isFr ? 'Création musicale et traitement audio.' : isDe ? 'Sounddesign, digitale Bearbeitung und Genres.' : isIt ? 'Composizione acustica e generi musicali digitali.' : isAr ? 'الإنتاج الموسيقي الرقمي ودراسة الأنواع الحديثة.' : isZh ? '学习数字音效合成、声频编辑以及现代流派。' : 'Цифровая обработка звука и изучение современных стилей.' 
                        },
                        { 
                            name: isEs ? 'Artes Escénicas y Danza' : isEn ? 'Performing Arts & Dance' : isFr ? 'Arts du Spectacle et Danse' : isDe ? 'Darstellendes Spiel & Tanz' : isIt ? 'Arti dello Spettacolo' : isAr ? 'الفنون المسرحية والتعبير الحركي' : isZh ? '戏剧表演与形体艺术' : 'Сценическое искусство / Сценічне мистецтво', 
                            desc: isEs ? 'Técnicas teatrales e improvisación.' : isEn ? 'Acting techniques, posture, and expression.' : isFr ? 'Théâtre, danse et expression artistique.' : isDe ? 'Schauspieltechnik, Körperhaltung und Ausdruck.' : isIt ? 'Tecniche del teatro, postura ed espressione.' : isAr ? 'تقنيات التمثيل المسرحي والارتجال والتعبير الإيمائي.' : isZh ? '舞台形体训练、台词表达与现场即兴表演。' : 'Актерское мастерство, сценическая речь и импровизация.' 
                        },
                        { 
                            name: isEs ? 'Formación y Orientación Personal y Profesional' : isEn ? 'Personal & Vocational Orientation' : isFr ? 'Orientation Personnelle et Professionnelle' : isDe ? 'Persönliche & Berufliche Orientierung' : isIt ? 'Orientamento Vocazionale' : isAr ? 'التوجيه والإرشاد المهني والشخصي' : isZh ? '生涯规划与职业启蒙' : 'Профориентация / Профорієнтація', 
                            desc: isEs ? 'Ayuda a planificar estudios posteriores.' : isEn ? 'Career guidance and self-discovery.' : isFr ? 'Aide à la planification des études futures.' : isDe ? 'Berufsberatung und Selbstfindung.' : isIt ? 'Supporto nella decisione del percorso scolastico futuro.' : isAr ? 'تحديد الخيارات الدراسية والمهنية الأنسب للمستقبل.' : isZh ? '自我探索与学业规划，帮助过渡到FP或高中。' : 'Помощь в выборе будущей профессии и профиля образования.' 
                        }
                    ],
                    observacion: isEs ? 'Seguro Escolar obligatorio (1,12 €).' : isEn ? 'Mandatory School Insurance (€1.12).' : isFr ? 'Assurance scolaire obligatoire (1,12 €).' : isDe ? 'Schülerversicherung ist Pflicht (1,12 €).' : isIt ? 'Assicurazione scolastica obbligatoria (1,12 €).' : isAr ? 'التأمين المدرسي إلزامي (1.12 يورو).' : isZh ? '强制缴纳学生保险（1.12欧元）。' : 'Оплата обязательной школьной страховки (1,12 евро).'
                }
            };
        };

        // --- ICONOS LOCALES ---
        const IconsComponents = {
            Globe: () => <svg className="h-6 w-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 002 2 2 2 0 012 2v.5a2.5 2.5 0 002.5 2.5h1.391M9 21a9 9 0 100-18 9 9 0 000 18z" /></svg>,
            Check: () => <svg className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3.5"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>,
            AlertCircle: () => <svg className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
            Menu: () => <svg className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>,
            X: () => <svg className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
        };

        const LOCAL_KNOWLEDGE = [
            {
                id: 'iande',
                keywords: ['iande', 'clave', 'contraseña', 'entrar', 'acceder', 'ipasen', 'pasen'],
                question: '¿Cómo consigo la clave iANDE?',
                answer: 'La clave iANDE (Identificador Andaluz Educativo) se envía automáticamente a las familias a través de la app iPASEN. La encontrarás en la sección de "Comunicaciones" (icono de sobre arriba a la derecha en la app) con el título "Identificador Andaluz Educativo (iANDE)". Si vienes de otra comunidad autónoma o no dispones de iPASEN, puedes solicitar la clave presencialmente en el instituto donde vayas a matricularte presentando tu DNI/NIE.'
            },
            {
                id: 'seguro',
                keywords: ['seguro escolar', 'pago seguro', 'pagar seguro', 'tasas seguro', 'seguro'],
                question: '¿Quién debe pagar el seguro escolar y cómo?',
                answer: 'El seguro escolar es obligatorio y cuesta 1,12 € aproximadamente. Se paga únicamente a partir de 3º de la ESO en adelante (incluyendo 3º ESO, 4º ESO, 1º y 2º de Bachillerato). Los alumnos de 1º y 2º de ESO están exentos de este pago. El abono se realiza de forma totalmente digital mediante tarjeta bancaria durante el propio proceso de envío en la Secretaría Virtual.'
            },
            {
                id: 'optativas',
                keywords: ['optativas', 'asignaturas', 'elegir optativas', 'religion', 'valores', 'itinerario'],
                question: '¿Cómo elegir las asignaturas optativas?',
                answer: 'En la plataforma oficial de la Junta de Andalucía tendrás que ordenar todas las asignaturas optativas de arriba a abajo por estricto orden de preferencia. Es de vital importancia rellenar el orden completo de manera realista: si la primera opción de tu lista no tiene plazas libres o no alcanza el número mínimo de alumnos para formar grupo, se te asignará automáticamente la segunda de tu orden.'
            },
            {
                id: 'transporte',
                keywords: ['transporte', 'bus', 'autobus', 'parada', 'ruta', 'colectivo'],
                question: '¿Cómo se solicita el transporte escolar?',
                answer: 'Si tienes derecho al servicio de transporte gratuito (por residir fuera de la zona de influencia peatonal del instituto), verás habilitada la casilla de solicitud en la sección de "Servicios Complementarios" de la matrícula. Allí mismo tendrás un menú desplegable para elegir la parada oficial de la ruta que mejor os convenga.'
            },
            {
                id: 'comedor',
                keywords: ['comedor', 'bonificacion', 'alergia', 'medico', 'precio', 'anexo'],
                question: '¿Qué documentos necesito para el comedor escolar?',
                answer: 'Para optar a una plaza de comedor escolar debes marcar la casilla en "Servicios Complementarios". Si solicitas bonificación en el precio, el sistema te solicitará autorizar el cruce telemático de datos de renta familiar o adjuntar la vida laboral y certificado de horario laboral de ambos progenitores si alegas incompatibilidad horaria de trabajo. En caso de alergias alimenticias, deberás aportar un informe médico oficial firmado.'
            },
            {
                id: 'firma',
                keywords: ['firma', 'firmar', 'sms', 'telefono', 'presentar', 'enviar', 'codigo'],
                question: '¿Cómo se firma y presenta la matrícula?',
                answer: 'Tras completar todos los anexos del borrador y adjuntar la documentación en formato PDF, el portal te mostrará la opción "Firmar y presentar solicitud". Para confirmarlo de forma legal, el sistema enviará un código SMS gratuito de un solo uso al teléfono móvil que indiques en pantalla. Introduce ese código para firmar. Al acabar, asegúrate de descargar el PDF del justificante que incluye el código de barras oficial de registro.'
            }
        ];

        function App() {
            const [lang, setLang] = useState(null);
            const [activeTab, setActiveTab] = useState('planner');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            // Chat State
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const messagesEndRef = useRef(null);

            // Optativas Planner State
            const [selectedCourse, setSelectedCourse] = useState('1eso');
            const [selectedDirigidas, setSelectedDirigidas] = useState({});
            const [preferredOptativas, setPreferredOptativas] = useState([]);
            const [religionOption, setReligionOption] = useState('Atención Educativa (Valores)');
            const [extraInfo, setExtraInfo] = useState({ transporte: false, comedor: false, ampa: true });

            // Checklist State
            const [checklistOptions, setChecklistOptions] = useState({
                separados: false,
                alergias: false,
                comedorSolicita: false,
                discapacidad: false,
                famNumerosa: false,
                traslado: false
            });

            // Sincronizar el chat al cambiar de idioma
            useEffect(() => {
                if (lang) {
                    const welcomeText = TRANSLATIONS[lang].chatWelcome;
                    setMessages([
                        {
                            sender: 'bot',
                            text: welcomeText,
                            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                        }
                    ]);
                }
            }, [lang]);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isTyping]);

            if (!lang) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-850 via-emerald-700 to-teal-950 p-4">
                        <div className="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl max-w-xl w-full text-center space-y-6">
                            <div className="bg-emerald-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto text-emerald-800 shadow-inner">
                                <IconsComponents.Globe />
                            </div>
                            <div>
                                <h1 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">MatriAndalucía</h1>
                                <p className="text-slate-500 font-bold text-xs sm:text-sm mt-1">Selecciona tu idioma / Select your language</p>
                            </div>
                            
                            {/* Rejilla de idiomas responsiva */}
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-3">
                                <button onClick={() => setLang('es')} className="p-3 sm:p-4 bg-slate-100 hover:bg-emerald-600 hover:text-white rounded-2xl font-bold transition text-xs flex flex-col items-center gap-1">
                                    <span className="text-xl sm:text-2xl">🇪🇸</span> Español
                                </button>
                                <button onClick={() => setLang('en')} className="p-3 sm:p-4 bg-slate-100 hover:bg-emerald-600 hover:text-white rounded-2xl font-bold transition text-xs flex flex-col items-center gap-1">
                                    <span className="text-xl sm:text-2xl">🇬🇧</span> English
                                </button>
                                <button onClick={() => setLang('it')} className="p-3 sm:p-4 bg-slate-100 hover:bg-emerald-600 hover:text-white rounded-2xl font-bold transition text-xs flex flex-col items-center gap-1">
                                    <span className="text-xl sm:text-2xl">🇮🇹</span> Italiano
                                </button>
                                <button onClick={() => setLang('fr')} className="p-3 sm:p-4 bg-slate-100 hover:bg-emerald-600 hover:text-white rounded-2xl font-bold transition text-xs flex flex-col items-center gap-1">
                                    <span className="text-xl sm:text-2xl">🇫🇷</span> Français
                                </button>
                                <button onClick={() => setLang('de')} className="p-3 sm:p-4 bg-slate-100 hover:bg-emerald-600 hover:text-white rounded-2xl font-bold transition text-xs flex flex-col items-center gap-1">
                                    <span className="text-xl sm:text-2xl">🇩🇪</span> Deutsch
                                </button>
                                <button onClick={() => setLang('ar')} className="p-3 sm:p-4 bg-slate-100 hover:bg-emerald-600 hover:text-white rounded-2xl font-bold transition text-xs flex flex-col items-center gap-1">
                                    <span className="text-xl sm:text-2xl">🇦🇪</span> العربية
                                </button>
                                <button onClick={() => setLang('zh')} className="p-3 sm:p-4 bg-slate-100 hover:bg-emerald-600 hover:text-white rounded-2xl font-bold transition text-xs flex flex-col items-center gap-1">
                                    <span className="text-xl sm:text-2xl">🇨🇳</span> 中文
                                </button>
                                <button onClick={() => setLang('ru')} className="p-3 sm:p-4 bg-slate-100 hover:bg-emerald-600 hover:text-white rounded-2xl font-bold transition text-xs flex flex-col items-center gap-1">
                                    <span className="text-xl sm:text-2xl">🇷🇺</span> Русский
                                </button>
                                <button onClick={() => setLang('uk')} className="p-3 sm:p-4 bg-slate-100 hover:bg-emerald-600 hover:text-white rounded-2xl font-bold transition text-xs flex flex-col items-center gap-1">
                                    <span className="text-xl sm:text-2xl">🇺🇦</span> Українська
                                </button>
                            </div>
                            <div className="text-[10px] text-slate-400 font-bold">
                                MatriAndalucía LOMLOE — 2026
                            </div>
                        </div>
                    </div>
                );
            }

            const t = TRANSLATIONS[lang];
            const courses = getCoursesData(lang);
            const currentCourseData = courses[selectedCourse] || courses['1eso'];

            const getLocalResponse = (query) => {
                const cleanQuery = query.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                
                for (const item of LOCAL_KNOWLEDGE) {
                    const cleanQuestion = item.question.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[¿?]/g, "");
                    const cleanInput = cleanQuery.replace(/[¿?]/g, "");
                    if (cleanInput === cleanQuestion || cleanInput.includes(cleanQuestion) || cleanQuestion.includes(cleanInput)) {
                        return item.answer;
                    }
                }

                // Respuestas rápidas en varios idiomas para soporte multilingüe en local
                if (cleanQuery.includes('iande') || cleanQuery.includes('clave')) {
                    return LOCAL_KNOWLEDGE[0].answer;
                }
                if (cleanQuery.includes('seguro') || cleanQuery.includes('insurance') || cleanQuery.includes('assurance')) {
                    return LOCAL_KNOWLEDGE[1].answer;
                }
                if (cleanQuery.includes('optativa') || cleanQuery.includes('elective') || cleanQuery.includes('option')) {
                    return LOCAL_KNOWLEDGE[2].answer;
                }

                return lang === 'es' ? 
                    "Por favor, revisa la pestaña 'Mis Elecciones' para configurar las asignaturas o pulsa sobre una pregunta frecuente a la izquierda." :
                    "Please review 'My Choices' tab to arrange subjects or click on a frequent question on the left panel.";
            };

            const handleSendMessage = (textToSend) => {
                const text = textToSend || inputText;
                if (!text.trim()) return;

                const userMsg = {
                    sender: 'user',
                    text: text,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                setMessages(prev => [...prev, userMsg]);
                if (!textToSend) setInputText('');
                setIsTyping(true);

                setTimeout(() => {
                    const botResponseText = getLocalResponse(text);
                    setMessages(prev => [...prev, {
                        sender: 'bot',
                        text: botResponseText,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }]);
                    setIsTyping(false);
                }, 600);
            };

            const toggleOptativa = (optName) => {
                if (preferredOptativas.includes(optName)) {
                    setPreferredOptativas(preferredOptativas.filter(item => item !== optName));
                } else {
                    setPreferredOptativas([...preferredOptativas, optName]);
                }
            };

            const selectDirigida = (dirigidaId, optionName) => {
                setSelectedDirigidas(prev => ({
                    ...prev,
                    [`${selectedCourse}_${dirigidaId}`]: optionName
                }));
            };

            const triggerPrint = () => {
                const printWindow = window.open('', '_blank');
                const courseDirigidas = currentCourseData.dirigidas.map(d => {
                    const chosen = selectedDirigidas[`${selectedCourse}_${d.id}`] || 'No seleccionada';
                    return `<li><strong>${d.title}:</strong> ${chosen}</li>`;
                }).join('');

                printWindow.document.write(`
                    <html>
                        <head>
                            <title>Borrador de Matrícula - MatriAndalucía</title>
                            <style>
                                body { font-family: sans-serif; padding: 40px; color: #1e293b; line-height: 1.6; }
                                h2 { color: #047857; border-bottom: 2px solid #a7f3d0; padding-bottom: 12px; margin-bottom: 24px; }
                                .section { margin-bottom: 24px; background: #f8fafc; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; }
                                .label { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: bold; letter-spacing: 0.05em; }
                                .val { font-size: 15px; font-weight: bold; margin-top: 4px; color: #0f172a; }
                            </style>
                        </head>
                        <body>
                            <h2>MatriAndalucía - ${currentCourseData.name}</h2>
                            <div class="section">
                                <div class="label">Valores o Religión:</div>
                                <div class="val">${religionOption}</div>
                            </div>
                            ${currentCourseData.dirigidas.length > 0 ? `
                            <div class="section">
                                <div class="label">Asignaturas Dirigidas:</div>
                                <div class="val"><ul>${courseDirigidas}</ul></div>
                            </div>` : ''}
                            <div class="section">
                                <div class="label">Orden Completo de Optativas:</div>
                                <div class="val">
                                    <ol>${preferredOptativas.map(o => `<li>${o}</li>`).join('')}</ol>
                                </div>
                            </div>
                            <p style="font-size: 11px; color: #64748b;">${t.footerText}</p>
                        </body>
                    </html>
                `);
                printWindow.document.close();
                printWindow.print();
            };

            const totalCourseOptativas = currentCourseData.optativas.length;
            const remainingToOrder = totalCourseOptativas - preferredOptativas.length;
            const progressPercent = Math.round((preferredOptativas.length / totalCourseOptativas) * 100);

            const allDirigidasSelected = currentCourseData.dirigidas.every(d => 
                !!selectedDirigidas[`${selectedCourse}_${d.id}`]
            );

            const canSubmit = remainingToOrder === 0 && allDirigidasSelected;

            return (
                <div className="min-h-screen flex flex-col bg-slate-50" dir={t.dir}>
                    {/* Header */}
                    <header className="bg-emerald-800 text-white shadow-lg sticky top-0 z-40">
                        <div className="h-1 bg-white flex">
                            <div className="w-1/3 bg-emerald-600"></div>
                            <div className="w-1/3 bg-white"></div>
                            <div className="w-1/3 bg-emerald-600"></div>
                        </div>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
                            <div className="flex items-center space-x-2">
                                <div className="bg-emerald-100 p-2 rounded-xl text-emerald-800 shadow-inner flex items-center justify-center shrink-0">
                                    <IconsComponents.Globe />
                                </div>
                                <h1 className="font-extrabold text-sm sm:text-xl tracking-tight truncate">
                                    MatriAndalucía
                                </h1>
                            </div>

                            {/* Desktop Nav */}
                            <nav className="hidden md:flex space-x-1">
                                <button onClick={() => setActiveTab('planner')} className={`px-3 py-2 rounded-xl text-sm font-bold transition ${activeTab === 'planner' ? 'bg-emerald-900 text-white shadow-inner' : 'text-emerald-100 hover:bg-emerald-700'}`}>
                                    {t.navPlanner}
                                </button>
                                <button onClick={() => setActiveTab('chat')} className={`px-3 py-2 rounded-xl text-sm font-bold transition ${activeTab === 'chat' ? 'bg-emerald-900 text-white shadow-inner' : 'text-emerald-100 hover:bg-emerald-700'}`}>
                                    {t.navChat}
                                </button>
                                <button onClick={() => setActiveTab('checklist')} className={`px-3 py-2 rounded-xl text-sm font-bold transition ${activeTab === 'checklist' ? 'bg-emerald-900 text-white shadow-inner' : 'text-emerald-100 hover:bg-emerald-700'}`}>
                                    {t.navCheck}
                                </button>
                                <button onClick={() => setActiveTab('guide')} className={`px-3 py-2 rounded-xl text-sm font-bold transition ${activeTab === 'guide' ? 'bg-emerald-900 text-white shadow-inner' : 'text-emerald-100 hover:bg-emerald-700'}`}>
                                    {t.navGuide}
                                </button>
                            </nav>

                            <div className="flex items-center space-x-2">
                                <button onClick={() => { setLang(null); setPreferredOptativas([]); }} className="text-[10px] sm:text-xs font-bold bg-emerald-950 px-2.5 py-1.5 rounded-xl border border-emerald-700 hover:bg-emerald-900 transition flex items-center gap-1">
                                    {t.back}
                                </button>
                                <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="md:hidden p-2 rounded-xl hover:bg-emerald-700 transition">
                                    {mobileMenuOpen ? <IconsComponents.X /> : <IconsComponents.Menu />}
                                </button>
                            </div>
                        </div>

                        {/* Mobile Drawer (Menu colapsable móvil) */}
                        {mobileMenuOpen && (
                            <div className="md:hidden bg-emerald-800 px-3 pt-2 pb-5 space-y-1 shadow-inner border-t border-emerald-600/30">
                                <button onClick={() => { setActiveTab('planner'); setMobileMenuOpen(false); }} className={`w-full text-left px-3 py-3 rounded-xl text-xs font-bold flex items-center gap-2 ${activeTab === 'planner' ? 'bg-emerald-900 text-white' : 'text-emerald-100'}`}>
                                    📝 {t.navPlanner}
                                </button>
                                <button onClick={() => { setActiveTab('chat'); setMobileMenuOpen(false); }} className={`w-full text-left px-3 py-3 rounded-xl text-xs font-bold flex items-center gap-2 ${activeTab === 'chat' ? 'bg-emerald-900 text-white' : 'text-emerald-100'}`}>
                                    💬 {t.navChat}
                                </button>
                                <button onClick={() => { setActiveTab('checklist'); setMobileMenuOpen(false); }} className={`w-full text-left px-3 py-3 rounded-xl text-xs font-bold flex items-center gap-2 ${activeTab === 'checklist' ? 'bg-emerald-900 text-white' : 'text-emerald-100'}`}>
                                    📋 {t.navCheck}
                                </button>
                                <button onClick={() => { setActiveTab('guide'); setMobileMenuOpen(false); }} className={`w-full text-left px-3 py-3 rounded-xl text-xs font-bold flex items-center gap-2 ${activeTab === 'guide' ? 'bg-emerald-900 text-white' : 'text-emerald-100'}`}>
                                    🗺️ {t.navGuide}
                                </button>
                            </div>
                        )}
                    </header>

                    {/* Main */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 lg:p-8">
                        {activeTab === 'planner' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 space-y-6">
                                    <div className="flex items-center gap-3 pb-4 border-b">
                                        <div className="p-2 bg-emerald-100 text-emerald-800 rounded-xl">
                                            <IconsComponents.Globe />
                                        </div>
                                        <div>
                                            <h3 className="font-extrabold text-base sm:text-lg text-slate-900">{t.navPlanner}</h3>
                                            <p className="text-[11px] sm:text-xs text-slate-500">{t.summaryDesc}</p>
                                        </div>
                                    </div>

                                    {/* Selección de Curso */}
                                    <div className="space-y-3">
                                        <label className="text-xs sm:text-sm font-bold text-slate-700 block">1. {t.course}:</label>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                            {Object.keys(courses).map((key) => (
                                                <button 
                                                    key={key} 
                                                    onClick={() => setSelectedCourse(key)} 
                                                    className={`px-2.5 py-2 text-xs rounded-xl font-bold border transition ${selectedCourse === key ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}`}
                                                >
                                                    {courses[key].name}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Obligatorias Comunes */}
                                    <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 sm:p-5">
                                        <h4 className="font-extrabold text-slate-900 text-xs sm:text-sm uppercase tracking-wider mb-2">{t.subjectTroncal}</h4>
                                        <p className="text-[10px] sm:text-[11px] text-slate-500 mb-3 leading-normal">{t.subjectTroncalDesc}</p>
                                        <div className="flex flex-wrap gap-1.5">
                                            {currentCourseData.troncales.map((materia, i) => (
                                                <span key={i} className="bg-white border border-slate-200 text-slate-700 text-[10px] sm:text-xs px-2.5 py-1.5 rounded-lg font-bold shadow-2xs">
                                                    {materia}
                                                </span>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Elecciones Dirigidas Obligatorias */}
                                    {currentCourseData.dirigidas.length > 0 && (
                                        <div className="space-y-4">
                                            <label className="text-xs sm:text-sm font-bold text-slate-700 block">2. {t.subjectDirigida}:</label>
                                            {currentCourseData.dirigidas.map((dirigida) => {
                                                const currentSelection = selectedDirigidas[`${selectedCourse}_${dirigida.id}`];
                                                return (
                                                    <div key={dirigida.id} className="bg-blue-50/50 border border-blue-200 rounded-2xl p-4 space-y-3">
                                                        <h4 className="font-extrabold text-blue-950 text-xs sm:text-sm">{dirigida.title}</h4>
                                                        <p className="text-[11px] text-blue-800 leading-normal">{dirigida.desc}</p>
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                            {dirigida.options.map((option) => {
                                                                const isChosen = currentSelection === option.name;
                                                                return (
                                                                    <button
                                                                        key={option.name}
                                                                        onClick={() => selectDirigida(dirigida.id, option.name)}
                                                                        className={`text-left p-3.5 rounded-xl border transition flex flex-col gap-1 ${isChosen ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-700 border-slate-200 hover:border-blue-400'}`}
                                                                    >
                                                                        <span className="font-extrabold text-xs sm:text-sm">{option.name}</span>
                                                                        <span className={`text-[10px] ${isChosen ? 'text-blue-100' : 'text-slate-500'}`}>{option.desc}</span>
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {/* Optativas */}
                                    <div className="space-y-3">
                                        <div className="flex justify-between items-center">
                                            <label className="text-xs sm:text-sm font-bold text-slate-700 block">3. {t.subjectOptativa}:</label>
                                            <span className="text-[10px] sm:text-[11px] bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-extrabold">
                                                {preferredOptativas.length} / {totalCourseOptativas}
                                            </span>
                                        </div>
                                        <p className="text-[10px] sm:text-[11px] text-slate-500 leading-normal bg-amber-50 border border-amber-200 p-3 rounded-xl text-amber-900">
                                            {t.subjectOptativaDesc}
                                        </p>
                                        <div className="grid grid-cols-1 gap-2.5">
                                            {currentCourseData.optativas.map((opt) => {
                                                const idx = preferredOptativas.indexOf(opt.name);
                                                const isSelected = idx !== -1;
                                                return (
                                                    <button 
                                                        key={opt.name} onClick={() => toggleOptativa(opt.name)}
                                                        className={`text-left p-3.5 sm:p-4 rounded-xl border transition flex justify-between items-center gap-4 ${isSelected ? 'bg-teal-50 border-teal-500 text-teal-950 border-2' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}`}
                                                    >
                                                        <div className="flex flex-col pr-1">
                                                            <span className="font-extrabold text-slate-900 text-xs sm:text-sm leading-tight">{opt.name}</span>
                                                            <span className="text-[10px] sm:text-xs text-slate-500 font-normal mt-1 leading-relaxed">{opt.desc}</span>
                                                        </div>
                                                        {isSelected ? (
                                                            <span className="bg-emerald-600 text-white px-2 sm:px-3 py-1.5 rounded-xl text-[9px] sm:text-[10px] font-extrabold shadow-xs shrink-0 whitespace-nowrap">
                                                                {idx + 1}º {t.order}
                                                            </span>
                                                        ) : (
                                                            <span className="border border-dashed border-slate-300 text-slate-500 bg-slate-50 px-2.5 py-1.5 rounded-xl text-[10px] font-bold hover:border-emerald-300 transition shrink-0">
                                                                +
                                                            </span>
                                                        )}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* Religión / Valores */}
                                    <div className="space-y-3">
                                        <label className="text-xs sm:text-sm font-bold text-slate-700 block">4. {t.subjectReligion}:</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            {['Religión Católica', 'Religión Evangélica', 'Atención Educativa (Valores)'].map((option) => (
                                                <button key={option} onClick={() => setReligionOption(option)} className={`px-2.5 py-2.5 text-xs rounded-xl font-bold border transition ${religionOption === option ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'}`}>{option}</button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Servicios Adicionales */}
                                    <div className="space-y-3 pt-4 border-t">
                                        <label className="text-xs sm:text-sm font-bold text-slate-700 block">{t.services}:</label>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            <label className="flex items-center gap-3 p-3.5 bg-slate-50 border rounded-xl text-xs font-bold cursor-pointer">
                                                <input type="checkbox" checked={extraInfo.transporte} onChange={(e) => setExtraInfo({...extraInfo, transporte: e.target.checked})} className="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4" />
                                                <span className="truncate">🚌 {t.transporte}</span>
                                            </label>
                                            <label className="flex items-center gap-3 p-3.5 bg-slate-50 border rounded-xl text-xs font-bold cursor-pointer">
                                                <input type="checkbox" checked={extraInfo.comedor} onChange={(e) => setExtraInfo({...extraInfo, comedor: e.target.checked})} className="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4" />
                                                <span className="truncate">🍽️ {t.comedor}</span>
                                            </label>
                                            <label className="flex items-center gap-3 p-3.5 bg-slate-50 border rounded-xl text-xs font-bold cursor-pointer">
                                                <input type="checkbox" checked={extraInfo.ampa} onChange={(e) => setExtraInfo({...extraInfo, ampa: e.target.checked})} className="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4" />
                                                <span className="truncate">👪 {t.ampa}</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                {/* Sidebar Resumen (Columna lateral adaptable en móviles como tarjeta inferior) */}
                                <div className="bg-slate-900 text-slate-100 rounded-2xl p-5 flex flex-col justify-between border h-fit lg:sticky lg:top-20">
                                    <div className="space-y-5">
                                        <h4 className="font-extrabold text-base text-white border-b border-slate-800 pb-2">{t.summaryTitle}</h4>
                                        
                                        <div className="space-y-4 text-xs">
                                            <div>
                                                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">{t.course}:</span>
                                                <p className="text-white font-bold text-base mt-0.5">{currentCourseData.name}</p>
                                            </div>

                                            {currentCourseData.dirigidas.length > 0 && (
                                                <div className="bg-slate-800 p-3 rounded-xl border border-slate-800 space-y-2">
                                                    <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">{t.subjectDirigida}:</span>
                                                    {currentCourseData.dirigidas.map(d => {
                                                        const selection = selectedDirigidas[`${selectedCourse}_${d.id}`];
                                                        return (
                                                            <div key={d.id} className="text-xs">
                                                                <span className="text-slate-400">{d.title}: </span>
                                                                <span className={selection ? 'text-blue-300 font-bold' : 'text-amber-400 font-bold'}>{selection || `❌ ${t.pending}`}</span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}

                                            <div>
                                                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">{t.order} de Optativas:</span>
                                                {preferredOptativas.length > 0 ? (
                                                    <ol className="list-decimal pl-5 space-y-1 mt-1 text-white font-bold">
                                                        {preferredOptativas.map((opt, i) => (
                                                            <li key={i} className="text-emerald-300 font-bold">{opt}</li>
                                                        ))}
                                                    </ol>
                                                ) : (
                                                    <p className="text-amber-400 font-bold mt-1">⚠️ {t.pending}...</p>
                                                )}
                                            </div>

                                            <div>
                                                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">{t.subjectReligion}:</span>
                                                <p className="text-white font-semibold mt-0.5">{religionOption}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="pt-5 border-t border-slate-800 mt-6">
                                        <button 
                                            onClick={triggerPrint} 
                                            disabled={!canSubmit}
                                            className={`w-full py-3.5 text-white rounded-xl text-xs font-extrabold transition flex items-center justify-center gap-2 shadow-md transform hover:-translate-y-0.5 ${!canSubmit ? 'bg-slate-800 text-slate-500 cursor-not-allowed hover:translate-y-0' : 'bg-emerald-600 hover:bg-emerald-700'}`}
                                        >
                                            {!canSubmit ? `${t.btnProgressPending} (${remainingToOrder})` : t.btnProgressReady}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB: CHAT (Estructura fluida y adaptable en móviles) */}
                        {activeTab === 'chat' && (
                            <div className="flex-1 grid grid-cols-1 lg:grid-cols-4 gap-6 min-h-[480px]">
                                <div className="lg:col-span-1 bg-white rounded-2xl border p-4 flex flex-col space-y-4">
                                    <h3 className="font-extrabold text-slate-900 text-sm flex items-center gap-2 border-b pb-2">
                                        {t.faqTitle}
                                    </h3>
                                    <div className="space-y-2 overflow-y-auto max-h-[160px] lg:max-h-none">
                                        {LOCAL_KNOWLEDGE.map((faq) => (
                                            <button key={faq.id} onClick={() => handleSendMessage(faq.question)} className="w-full text-left text-xs p-3 rounded-xl border border-slate-100 hover:border-emerald-300 hover:bg-emerald-50 transition font-bold text-slate-700 flex justify-between items-center gap-2">
                                                <span className="truncate">{faq.question}</span>
                                                <IconsComponents.Check />
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="lg:col-span-3 bg-white rounded-2xl shadow-xs border flex flex-col h-[400px] sm:h-[500px] overflow-hidden">
                                    <div className="bg-slate-900 text-white px-4 py-3 flex items-center justify-between border-b">
                                        <span className="font-extrabold text-sm">{t.chatHeader}</span>
                                    </div>
                                    <div className="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50">
                                        {messages.map((msg, idx) => (
                                            <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`rounded-xl px-4 py-2.5 text-xs sm:text-sm max-w-[85%] shadow-xs leading-relaxed ${msg.sender === 'user' ? 'bg-emerald-700 text-white rounded-tr-none' : 'bg-white text-slate-800 border rounded-tl-none'}`}>
                                                    {msg.text}
                                                </div>
                                            </div>
                                        ))}
                                        {isTyping && <div className="text-xs italic text-slate-400">{t.typing}</div>}
                                        <div ref={messagesEndRef} />
                                    </div>
                                    <div className="p-3 bg-white border-t flex gap-2">
                                        <input type="text" placeholder={t.placeholderChat} value={inputText} onChange={(e) => setInputText(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()} className="flex-1 px-4 py-2 border rounded-full text-xs sm:text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
                                        <button onClick={() => handleSendMessage()} className="bg-emerald-600 text-white px-4 py-2 rounded-full font-black text-xs shrink-0">OK</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB: CHECKLIST */}
                        {activeTab === 'checklist' && (
                            <div className="bg-white rounded-2xl shadow-xs border border-slate-200 p-4 sm:p-6 space-y-6">
                                <h3 className="font-black text-base sm:text-lg text-slate-900 border-b pb-2">{t.checklistTitle}</h3>
                                <p className="text-xs text-slate-500">{t.checkDesc}</p>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                                    <label className="flex items-center gap-3 p-3.5 bg-slate-50 border rounded-xl text-xs font-bold cursor-pointer">
                                        <input type="checkbox" checked={checklistOptions.separados} onChange={(e) => setChecklistOptions({...checklistOptions, separados: e.target.checked})} className="rounded text-emerald-600 w-4 h-4" />
                                        <span>{t.checkSeparados}</span>
                                    </label>
                                    <label className="flex items-center gap-3 p-3.5 bg-slate-50 border rounded-xl text-xs font-bold cursor-pointer">
                                        <input type="checkbox" checked={checklistOptions.alergias} onChange={(e) => setChecklistOptions({...checklistOptions, alergias: e.target.checked})} className="rounded text-emerald-600 w-4 h-4" />
                                        <span>{t.checkAlergias}</span>
                                    </label>
                                    <label className="flex items-center gap-3 p-3.5 bg-slate-50 border rounded-xl text-xs font-bold cursor-pointer">
                                        <input type="checkbox" checked={checklistOptions.comedorSolicita} onChange={(e) => setChecklistOptions({...checklistOptions, comedorSolicita: e.target.checked})} className="rounded text-emerald-600 w-4 h-4" />
                                        <span>{t.checkComedor}</span>
                                    </label>
                                    <label className="flex items-center gap-3 p-3.5 bg-slate-50 border rounded-xl text-xs font-bold cursor-pointer">
                                        <input type="checkbox" checked={checklistOptions.discapacidad} onChange={(e) => setChecklistOptions({...checklistOptions, discapacidad: e.target.checked})} className="rounded text-emerald-600 w-4 h-4" />
                                        <span>{t.checkDiscapacidad}</span>
                                    </label>
                                    <label className="flex items-center gap-3 p-3.5 bg-slate-50 border rounded-xl text-xs font-bold cursor-pointer">
                                        <input type="checkbox" checked={checklistOptions.famNumerosa} onChange={(e) => setChecklistOptions({...checklistOptions, famNumerosa: e.target.checked})} className="rounded text-emerald-600 w-4 h-4" />
                                        <span>{t.checkFamNum}</span>
                                    </label>
                                    <label className="flex items-center gap-3 p-3.5 bg-slate-50 border rounded-xl text-xs font-bold cursor-pointer">
                                        <input type="checkbox" checked={checklistOptions.traslado} onChange={(e) => setChecklistOptions({...checklistOptions, traslado: e.target.checked})} className="rounded text-emerald-600 w-4 h-4" />
                                        <span>{t.checkTraslado}</span>
                                    </label>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t">
                                    <div className="bg-emerald-50/20 p-4 sm:p-5 border border-emerald-100 rounded-2xl space-y-3 shadow-2xs">
                                        <h5 className="font-extrabold text-emerald-950 text-xs sm:text-sm flex items-center gap-2">
                                            <span className="w-2.5 h-2.5 bg-emerald-600 rounded-full"></span>
                                            {t.commonDocsTitle}:
                                        </h5>
                                        <ul className="space-y-3 text-xs sm:text-sm text-slate-700">
                                            {t.commonDocs.map((doc, idx) => (
                                                <li key={idx} className="flex items-start gap-2.5">
                                                    <IconsComponents.Check />
                                                    <span>{doc}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>

                                    <div className="p-4 sm:p-5 border border-slate-200 rounded-2xl bg-white space-y-3">
                                        <h5 className="font-extrabold text-slate-900 text-xs sm:text-sm flex items-center gap-2">
                                            <span className="w-2.5 h-2.5 bg-amber-500 rounded-full"></span>
                                            {t.conditionalDocsTitle}:
                                        </h5>
                                        <ul className="space-y-3 text-xs sm:text-sm text-slate-700">
                                            {checklistOptions.separados && <li className="flex gap-2"><IconsComponents.AlertCircle /> <span>{t.condSeparados}</span></li>}
                                            {checklistOptions.alergias && <li className="flex gap-2"><IconsComponents.AlertCircle /> <span>{t.condAlergias}</span></li>}
                                            {checklistOptions.comedorSolicita && <li className="flex gap-2"><IconsComponents.AlertCircle /> <span>{t.condComedor}</span></li>}
                                            {checklistOptions.discapacidad && <li className="flex gap-2"><IconsComponents.AlertCircle /> <span>{t.condDiscapacidad}</span></li>}
                                            {checklistOptions.famNumerosa && <li className="flex gap-2"><IconsComponents.AlertCircle /> <span>{t.condFamNum}</span></li>}
                                            {checklistOptions.traslado && <li className="flex gap-2"><IconsComponents.AlertCircle /> <span>{t.condTraslado}</span></li>}
                                            {!checklistOptions.separados && !checklistOptions.alergias && !checklistOptions.comedorSolicita && !checklistOptions.discapacidad && !checklistOptions.famNumerosa && !checklistOptions.traslado && (
                                                <li className="text-slate-500 italic text-center py-4">{t.condNone}</li>
                                            )}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB: PASO A PASO */}
                        {activeTab === 'guide' && (
                            <div className="bg-white rounded-2xl shadow-xs border border-slate-200 p-4 sm:p-5 sm:p-6 space-y-6">
                                <div className="pb-4 border-b">
                                    <h3 className="font-extrabold text-base sm:text-lg text-slate-900">{t.guideTitle}</h3>
                                    <p className="text-xs text-slate-500">{t.guideDesc}</p>
                                </div>

                                <div className="space-y-4">
                                    {[1, 2, 3, 4, 5].map((stepNum) => (
                                        <div key={stepNum} className="flex flex-col sm:flex-row gap-4 p-4 rounded-2xl border border-slate-100 hover:border-emerald-100 transition">
                                            <div className="w-10 h-10 sm:w-12 sm:h-12 bg-emerald-600 text-white rounded-full flex items-center justify-center font-black text-sm sm:text-lg shrink-0 shadow-md">
                                                {stepNum}
                                            </div>
                                            <div className="space-y-1">
                                                <h4 className="font-bold text-slate-900 text-xs sm:text-base">{t[`guide${stepNum}Title`]}</h4>
                                                <p className="text-[11px] sm:text-xs text-slate-600 leading-relaxed">{t[`guide${stepNum}Desc`]}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-[10px] sm:text-xs">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-6 text-center md:text-left">
                            <div>
                                <p className="font-bold text-slate-200 text-sm">💚 MatriAndalucía — Multilingual Guide 2026</p>
                                <p className="px-2 md:px-0 leading-relaxed">{t.footerText}</p>
                            </div>
                            <a href="https://www.juntadeandalucia.es/educacion/secretariavirtual/" target="_blank" rel="noreferrer" className="text-emerald-400 hover:text-emerald-300 transition hover:underline font-bold shrink-0">
                                {t.officialPortal}
                            </a>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
